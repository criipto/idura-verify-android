on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # The authTab flavor forces an Auth Tab, which needs Chrome 132+. The plain
      # google_apis images bundle an old Chrome (API 34 ships 113), so only the
      # google_apis_playstore image — API 36 bundles Chrome 133 — can exercise the
      # Auth Tab path. Don't downgrade to google_apis without re-checking its Chrome.
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google-apis-playstore-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      # Once per host kind: MainActivity covers the ComponentActivity path, PlainHostActivity the
      # plain android.app.Activity one, where the SDK owns the activity result registry and the host
      # forwards onActivityResult. Only the mock logins — every other case in these suites depends on
      # a third-party eID page and stays local, see CancellationTest.
      - name: Run mock login test on both tab types and both host kinds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :example:runAllBrowserTests -PtestBuildType=release -Pandroid.testInstrumentationRunnerArguments.class=eu.idura.verifyexample.LoginTest#runMockLogin,eu.idura.verifyexample.PlainHostLoginTest#runMockLoginOnAPlainActivity

      # connected_android_test_additional_output/ is where AGP auto-pulls files
      # written by tests to the additionalTestOutputDir instrumentation arg
      # (used by CaptureOnFailure to drop screenshots and hierarchy dumps).
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-artifacts
          path: |
            example/build/reports/androidTests/
            example/build/outputs/androidTest-results/
            example/build/outputs/connected_android_test_additional_output/
